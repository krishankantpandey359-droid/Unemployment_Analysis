name: Notebook execution checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib seaborn jupyter nbconvert nbformat
      - name: Execute complete notebook
        run: jupyter nbconvert --to notebook --execute "CodeAlpha_Unemployment_Analysis (1).ipynb" --output executed_notebook.ipynb --ExecutePreprocessor.timeout=600
      - name: Verify executed notebook outputs
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path
          notebook = nbformat.read(Path("executed_notebook.ipynb"), as_version=4)
          cells = [cell for cell in notebook.cells if cell.cell_type == "code" and cell.source.strip()]
          assert cells, "No executable code cells found"
          assert all(cell.execution_count is not None for cell in cells), "Some code cells did not execute"
          errors = [(i, out.ename, out.evalue) for i, cell in enumerate(notebook.cells) if cell.cell_type == "code" for out in cell.get("outputs", []) if out.output_type == "error"]
          assert not errors, f"Notebook errors: {errors}"
          assert any(out.output_type in {"display_data", "execute_result"} for cell in cells for out in cell.get("outputs", [])), "No rendered outputs found"
          print(f"Executed {len(cells)} code cells without errors.")
          PY
